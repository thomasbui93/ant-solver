<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Word Unscrambler</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f5f5f5;
                margin: 0;
                padding: 0;
            }
            .container {
                max-width: 700px;
                margin: 40px auto;
                background: #fff;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            }
            h1 {
                text-align: center;
                margin-bottom: 20px;
            }
            form {
                display: grid;
                gap: 10px;
            }
            input {
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 1rem;
            }
            button {
                padding: 10px;
                border: none;
                background: #0077ff;
                color: #fff;
                border-radius: 6px;
                font-size: 1rem;
                cursor: pointer;
            }
            button:disabled {
                background: #999;
            }
            #results {
                margin-top: 20px;
            }
            .group {
                background: #fafafa;
                padding: 10px 15px;
                border-radius: 6px;
                margin-bottom: 10px;
                border: 1px solid #eee;
            }
            .group h3 {
                margin: 0 0 6px;
                font-size: 1rem;
            }
            .group ul {
                margin: 0;
                padding-left: 20px;
            }
            .group li {
                cursor: pointer;
                color: #0077ff;
            }
            .group li:hover {
                text-decoration: underline;
            }

            /* Modal styles */
            .modal-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.6);
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }
            .modal {
                background: #fff;
                max-width: 500px;
                width: 90%;
                max-height: 80vh;
                overflow-y: auto;
                border-radius: 10px;
                padding: 20px;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            }
            .modal h2 {
                margin-top: 0;
            }
            .close-btn {
                background: #0077ff;
                border: none;
                color: white;
                padding: 8px 14px;
                border-radius: 6px;
                cursor: pointer;
                float: right;
            }
            .definition {
                margin-bottom: 10px;
            }
            .part-of-speech {
                font-weight: bold;
                margin-bottom: 4px;
            }
            .meaning {
                margin-left: 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Word Unscrambler</h1>
            <form id="unscrambleForm">
                <input
                    type="text"
                    id="q"
                    placeholder="Enter scrambled word (e.g. tamponh)"
                    required
                />
                <input
                    type="text"
                    id="start"
                    placeholder="Start with (optional)"
                />
                <input type="text" id="end" placeholder="End with (optional)" />
                <input
                    type="number"
                    id="length"
                    placeholder="Length (optional)"
                    min="1"
                />
                <button type="submit">Unscramble</button>
            </form>

            <div
                id="status"
                style="margin-top: 15px; color: #666; text-align: center"
            ></div>
            <div id="results"></div>
        </div>

        <!-- Modal -->
        <div id="modalOverlay" class="modal-overlay">
            <div class="modal">
                <button class="close-btn" id="closeModal">Close</button>
                <div id="modalContent"></div>
            </div>
        </div>

        <script>
            const form = document.getElementById("unscrambleForm");
            const statusEl = document.getElementById("status");
            const resultsEl = document.getElementById("results");
            const modalOverlay = document.getElementById("modalOverlay");
            const modalContent = document.getElementById("modalContent");
            const closeModal = document.getElementById("closeModal");
            const definitionCache = new Map();

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const q = document.getElementById("q").value.trim();
                const start = document.getElementById("start").value.trim();
                const end = document.getElementById("end").value.trim();
                const length = document.getElementById("length").value.trim();

                if (!q) return;
                resultsEl.innerHTML = "";
                statusEl.textContent = "Loading...";

                try {
                    const params = new URLSearchParams({ q });
                    if (start) params.append("start", start);
                    if (end) params.append("end", end);
                    if (length) params.append("length", length);

                    const res = await fetch(
                        `/api/unscramble?${params.toString()}`,
                    );
                    if (!res.ok) throw new Error("Request failed");

                    const data = await res.json();
                    statusEl.textContent = "";

                    if (!Object.keys(data).length) {
                        resultsEl.innerHTML =
                            '<p style="text-align:center;color:#999">No results found.</p>';
                        return;
                    }

                    for (const len of Object.keys(data).sort((a, b) => a - b)) {
                        const group = document.createElement("div");
                        group.className = "group";
                        const listItems = data[len]
                            .map((w) => `<li data-word="${w}">${w}</li>`)
                            .join("");
                        group.innerHTML = `<h3>${len} letters</h3><ul>${listItems}</ul>`;
                        resultsEl.appendChild(group);
                    }
                } catch (err) {
                    console.error(err);
                    statusEl.textContent = "Error fetching results.";
                }
            });

            resultsEl.addEventListener("click", async (e) => {
                const li = e.target.closest("li[data-word]");
                if (!li) return;

                const word = li.getAttribute("data-word");
                modalContent.innerHTML = `<h2>${word}</h2><p>Loading definition...</p>`;
                modalOverlay.style.display = "flex";

                try {
                    const data = await getDefinitions(word);
                    renderDefinitions(data, word);
                } catch (err) {
                    modalContent.innerHTML = `<h2>${word}</h2><p style='color:#999'>No definition found.</p>`;
                }
            });

            async function getDefinitions(word) {
                if (definitionCache.has(word)) {
                    return definitionCache.get(word);
                }
                const res = await fetch(
                    `https://api.dictionaryapi.dev/api/v2/entries/en/${word}`,
                );
                if (!res.ok) throw new Error("No definition found");
                const data = await res.json();
                definitionCache.set(word, data);
                return data;
            }

            function renderDefinitions(entries, word) {
                let html = `<h2>${word}</h2>`;
                entries.forEach((entry) => {
                    entry.meanings.forEach((m) => {
                        html += `<div class='definition'><div class='part-of-speech'>${m.partOfSpeech}</div>`;
                        m.definitions.forEach((d, i) => {
                            html += `<div class='meaning'>${i + 1}. ${d.definition}`;
                            if (d.example)
                                html += `<br><em>Example:</em> ${d.example}`;
                            html += `</div>`;
                        });
                        html += `</div>`;
                    });
                });
                modalContent.innerHTML = html;
            }

            closeModal.addEventListener("click", () => {
                modalOverlay.style.display = "none";
            });

            modalOverlay.addEventListener("click", (e) => {
                if (e.target === modalOverlay)
                    modalOverlay.style.display = "none";
            });
        </script>
    </body>
</html>
