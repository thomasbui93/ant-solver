<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Unscrambler</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:0}.container{max-width:700px;margin:40px auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.05)}h1{text-align:center;margin-bottom:20px}form{display:grid;gap:10px}input{text-transform:uppercase;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:1rem}button{padding:10px;border:none;background:#07f;color:#fff;border-radius:6px;font-size:1rem;cursor:pointer}button:disabled{background:#999}#results{margin-top:20px}.group{background:#fafafa;padding:10px 15px;border-radius:6px;margin-bottom:10px;border:1px solid #eee}.group h3{margin:0 0 6px;font-size:1rem}.group ul{margin:0;padding-left:20px}.group li{cursor:pointer;color:#07f}.group li:hover{text-decoration:underline}.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:1000}.modal{background:#fff;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;border-radius:10px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.2)}.modal h2{margin-top:0}.close-btn{background:#07f;border:none;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;float:right}.definition{margin-bottom:10px}.part-of-speech{font-weight:700;margin-bottom:4px}.meaning{margin-left:10px}</style><div class="container"><h1>Word Unscrambler</h1><form id="unscrambleForm" style="display:grid;gap:10px"><input type="text" id="q" placeholder="Enter scrambled word (e.g. tamponh)" required> <input type="text" id="start" placeholder="Start with (optional)"> <input type="text" id="end" placeholder="End with (optional)"> <input type="number" id="length" placeholder="Length (optional)" min="1"><div style="display:flex;gap:10px"><button type="submit" style="flex:1">Unscramble</button> <button type="button" id="clearBtn" style="flex:1;background:#999">Clear</button></div></form><div id="status" style="margin-top:15px;color:#666;text-align:center"></div><div id="results"></div></div><div id="modalOverlay" class="modal-overlay"><div class="modal"><button class="close-btn" id="closeModal">Close</button><div id="modalContent"></div></div></div><script>const form=document.getElementById("unscrambleForm"),statusEl=document.getElementById("status"),resultsEl=document.getElementById("results"),modalOverlay=document.getElementById("modalOverlay"),modalContent=document.getElementById("modalContent"),closeModal=document.getElementById("closeModal"),definitionCache=new Map;async function getDefinitions(e){if(definitionCache.has(e))return definitionCache.get(e);const t=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${e}`);if(!t.ok)throw new Error("No definition found");const n=await t.json();return definitionCache.set(e,n),n}function renderDefinitions(e,t){let n=`<h2>${t}</h2>`;e.forEach(e=>{e.meanings.forEach(e=>{n+=`<div class='definition'><div class='part-of-speech'>${e.partOfSpeech}</div>`,e.definitions.forEach((e,t)=>{n+=`<div class='meaning'>${t+1}. ${e.definition}`,e.example&&(n+=`<br><em>Example:</em> ${e.example}`),n+="</div>"}),n+="</div>"})}),modalContent.innerHTML=n}form.addEventListener("submit",async e=>{e.preventDefault();const t=document.getElementById("q").value.trim(),n=document.getElementById("start").value.trim(),o=document.getElementById("end").value.trim(),a=document.getElementById("length").value.trim();if(t){resultsEl.innerHTML="",statusEl.textContent="Loading...";try{const e=new URLSearchParams({q:t});n&&e.append("start",n),o&&e.append("end",o),a&&e.append("length",a);const l=await fetch(`/api/unscramble?${e.toString()}`);if(!l.ok)throw new Error("Request failed");const i=await l.json();if(statusEl.textContent="",!Object.keys(i).length)return void(resultsEl.innerHTML='<p style="text-align:center;color:#999">No results found.</p>');for(const e of Object.keys(i).sort((e,t)=>t-e)){const t=document.createElement("div");t.className="group";const n=i[e].map(e=>`<li data-word="${e}">${e}</li>`).join("");t.innerHTML=`<h3>${e} letters</h3><ul>${n}</ul>`,resultsEl.appendChild(t)}}catch(e){console.error(e),statusEl.textContent="Error fetching results."}}}),resultsEl.addEventListener("click",async e=>{const t=e.target.closest("li[data-word]");if(!t)return;const n=t.getAttribute("data-word");modalContent.innerHTML=`<h2>${n}</h2><p>Loading definition...</p>`,modalOverlay.style.display="flex";try{renderDefinitions(await getDefinitions(n),n)}catch(e){modalContent.innerHTML=`<h2>${n}</h2><p style='color:#999'>No definition found.</p>`}}),closeModal.addEventListener("click",()=>{modalOverlay.style.display="none"}),modalOverlay.addEventListener("click",e=>{e.target===modalOverlay&&(modalOverlay.style.display="none")});const clearBtn=document.getElementById("clearBtn");clearBtn.addEventListener("click",()=>{document.getElementById("q").value="",document.getElementById("start").value="",document.getElementById("end").value="",document.getElementById("length").value="",resultsEl.innerHTML="",statusEl.textContent=""})</script>
